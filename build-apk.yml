name: Build Kanyatsi Restaurant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f kagando_akanyatsi_restaurant_app/pubspec.yaml ]; then
            echo "path=kagando_akanyatsi_restaurant_app" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find pubspec.yaml."
            find . -maxdepth 4 -name pubspec.yaml
            exit 1
          fi

      - name: Make sure main.dart is in lib/
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          mkdir -p lib
          if [ ! -f lib/main.dart ] && [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi
          test -f lib/main.dart
          for f in brand.dart stock.dart delivery.dart; do
            test -f "lib/$f" || { echo "Missing lib/$f - upload the whole lib folder."; exit 1; }
          done
          test -f assets/logo.png || { echo "Missing assets folder - upload the whole assets folder."; exit 1; }

      - name: Generate Android platform files
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.kagando --project-name kagando_akanyatsi_restaurant
          fi

      - name: Configure Android (name, permissions, notifications)
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml

          # App name shown under the icon
          sed -i 's|android:label="[^"]*"|android:label="Kanyatsi Restaurant"|' "$M"

          # Permissions: internet, camera (photos), notifications
          for perm in INTERNET CAMERA POST_NOTIFICATIONS READ_MEDIA_IMAGES; do
            if ! grep -q "android.permission.$perm" "$M"; then
              sed -i "s|<manifest[^>]*>|&\n    <uses-permission android:name=\"android.permission.$perm\"/>|" "$M"
            fi
          done
          # Android 12 and below: allow gallery/file picker access without broad all-files access.
          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$M"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n</manifest>|' "$M"
          fi
          grep -n "uses-permission\|android:label" "$M"

          # Small notification icon
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat.png android/app/src/main/res/drawable/ic_stat.png

          # flutter_local_notifications needs "core library desugaring"
          python3 - <<'PY'
          import re, pathlib
          base = pathlib.Path('android/app')
          kts, groovy = base / 'build.gradle.kts', base / 'build.gradle'
          if kts.exists():
              t = kts.read_text()
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  t = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', t, count=1)
              if 'coreLibraryDesugaring(' not in t:
                  t += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kts.write_text(t)
              print('patched', kts)
          elif groovy.exists():
              t = groovy.read_text()
              if 'coreLibraryDesugaringEnabled' not in t:
                  t = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', t, count=1)
              if 'coreLibraryDesugaring ' not in t:
                  t += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              groovy.write_text(t)
              print('patched', groovy)
          else:
              raise SystemExit('No android/app/build.gradle(.kts) found')
          PY
          grep -n "esugaring" android/app/build.gradle* 

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Make the app icon
        working-directory: ${{ steps.project.outputs.path }}
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Check Flutter code
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanyatsi-restaurant-release-apk
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
